version: 2

project_name: terraform-provider-airtelcloud

before:
  hooks:
    - go mod tidy

builds:
  - id: terraform-provider

    binary: terraform-provider-airtelcloud

    env:
      - CGO_ENABLED=0

    goos:
      - darwin
      - linux
      - freebsd
      - openbsd
      - solaris
      - windows

    goarch:
      - amd64
      - arm64
      - arm
      - "386"

    ignore:
      # Unsupported combinations
      - goos: darwin
        goarch: arm

      - goos: darwin
        goarch: "386"

      - goos: solaris
        goarch: arm64

      - goos: solaris
        goarch: arm

      - goos: solaris
        goarch: "386"

      - goos: openbsd
        goarch: arm

      - goos: openbsd
        goarch: arm64

      - goos: linux
        goarch: arm64

      - goos: freebsd
        goarch: arm64

      - goos: windows
        goarch: arm

      - goos: windows
        goarch: arm64

archives:
  - id: provider

    formats:
      - zip

    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: SHA256SUMS

snapshot:
  version_template: "{{ incpatch .Version }}-dev"

changelog:
  sort: asc

release:
  draft: false
  prerelease: auto
