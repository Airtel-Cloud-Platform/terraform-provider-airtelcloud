# Custom secret rules: credentials for OUR cloud.
# TruffleHog verifies 800+ third-party key types (AWS, GCP, GitHub, Slack...) but has no
# detector for Airtel Cloud keys, so these rules are what catch a leak like the recent one.
#
# TODO(platform team): once the exact key format is confirmed (prefix, length, charset),
# add a format-only rule below, e.g.  regex: '\bACP[A-Z0-9]{20}\b'  so keys are caught
# even when they are not next to a recognisable variable name.
rules:
  - id: airtelcloud-credential-assignment
    category: AirtelCloud
    title: Airtel Cloud credential assigned to a variable, env var or provider argument
    severity: CRITICAL
    keywords:
      - airtel
      - acp_
    regex: (?i)\b(?:airtel[_-]?cloud|airtel|acp)[_-]?(?:api[_-]?key|api[_-]?secret|secret[_-]?key|access[_-]?key|client[_-]?secret|token|password)\b["']?\s*(?:=|:|:=)\s*["'](?P<secret>[A-Za-z0-9/+=_\-.]{16,})["']
    secret-group-name: secret

  - id: airtelcloud-provider-block-credential
    category: AirtelCloud
    title: Literal credential in a provider "airtelcloud" block
    severity: CRITICAL
    keywords:
      - airtelcloud
    regex: (?is)provider\s+"airtelcloud"\s*\{[^}]*?\b(?:api_key|api_secret|access_key|secret_key|client_secret|password|token)\s*=\s*"(?P<secret>[A-Za-z0-9/+=_\-.]{16,})"
    secret-group-name: secret

# Trivy's built-in allow rules skip any path containing "example", any *_test.go and every
# *.md file. For a provider those are exactly where keys leak (examples/, acceptance tests,
# docs/), so turn them back on.
disable-allow-rules:
  - examples
  - tests
  - markdown

allow-rules:
  - id: placeholders
    description: Documentation placeholders
    regex: (?i)(\byour[-_][a-z0-9_-]+|REPLACE_ME|<[^>]+>|x{8,}|example|dummy|changeme|\.\.\.)
